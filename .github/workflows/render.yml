name: render-film

# 手动触发：Actions 页面 → Run workflow
on:
  workflow_dispatch:
    inputs:
      frames:
        description: '可选：只渲前 N 帧做测试（留空=整片）'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system deps (ffmpeg + chromium libs + CJK fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-cjk \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgbm1 libpangocairo-1.0-0 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libasound2t64 || \
          sudo apt-get install -y --no-install-recommends libasound2
          ffmpeg -version | head -1
          fc-list | grep -i "Noto Sans CJK" | head -3

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render (silent)
        run: |
          if [ -n "${{ github.event.inputs.frames }}" ]; then
            npm run render -- --frames=0-${{ github.event.inputs.frames }}
          else
            npm run render
          fi
          ls -la out/

      - name: Mux narration + burn subtitles
        run: |
          if [ -n "${{ github.event.inputs.frames }}" ]; then
            echo "test run, skip mux"
            cp out/silent.mp4 out/film.mp4
          else
            ffmpeg -y -i out/silent.mp4 -i public/voice/narration.m4a \
              -vf "ass=public/subs.ass" \
              -c:v libx264 -crf 18 -preset veryfast -pix_fmt yuv420p \
              -c:a aac -b:a 192k -shortest \
              out/film.mp4
          fi
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/film.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepsea-film
          path: out/film.mp4
          retention-days: 30
